<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moxxi Slot Machine</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <div id="slot-host"></div>

  <script
    src="slot-machine-widget.js"
    data-credits="200"
    data-storage="local"
    data-storage-key="slot-v1"
    data-target="#slot-host"
    data-theme="dark"
    data-bets="5,10,25,50">
  </script>
</body>
</html>
